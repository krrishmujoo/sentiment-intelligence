<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sentiment Analyzer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            display: none;
        }

        #error,
        #batch-error {
            margin-top: 15px;
            color: red;
        }

        #batch-results {
            margin-top: 25px;
            display: none;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #f3f3f3;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>
            Sentiment Analyzer
        </h1>

        <p>
            Enter an app review below.
        </p>

        <textarea
            id="review"
            placeholder="Example: I love this app, it works perfectly."
        ></textarea>

        <br>

        <button id="analyze-button">
            Analyze Sentiment
        </button>

        <div id="error"></div>


        <!-- SINGLE REVIEW RESULT -->

        <div id="result">

            <h2>
                Sentiment:
                <span id="sentiment"></span>
            </h2>

            <p>
                Confidence:
                <span id="confidence"></span>
            </p>

            <p>
                Confidence level:
                <span id="confidence-level"></span>
            </p>

            <p>
                Negative:
                <span id="negative"></span>
            </p>

            <p>
                Neutral:
                <span id="neutral"></span>
            </p>

            <p>
                Positive:
                <span id="positive"></span>
            </p>

            <p>
                Uncertain:
                <span id="uncertain"></span>
            </p>

        </div>


        <!-- BATCH ANALYSIS -->

        <hr style="margin: 40px 0;">


        <h2>
            Batch Analysis
        </h2>

        <p>
            Enter one review per line.
        </p>

        <textarea
            id="batch-reviews"
            placeholder="Amazing app&#10;Terrible experience&#10;It works fine"
        ></textarea>

        <br>

        <button id="batch-button">
            Analyze Batch
        </button>

        <div id="batch-error"></div>


        <!-- BATCH RESULTS -->

        <div id="batch-results">

            <h3>
                Batch Results
            </h3>

            <table id="batch-table">

                <thead>

                    <tr>
                        <th>Review</th>
                        <th>Sentiment</th>
                        <th>Confidence</th>
                        <th>Uncertain</th>
                    </tr>

                </thead>

                <tbody id="batch-table-body">
                </tbody>

            </table>

        </div>

    </div>


    <script>

        /*
        ==============================
        SINGLE REVIEW ANALYSIS
        ==============================
        */

        const button =
            document.getElementById(
                "analyze-button"
            );


        button.addEventListener(
            "click",

            async function () {

                const review =
                    document
                        .getElementById(
                            "review"
                        )
                        .value
                        .trim();


                const errorElement =
                    document.getElementById(
                        "error"
                    );


                const resultElement =
                    document.getElementById(
                        "result"
                    );


                errorElement.textContent = "";

                resultElement.style.display =
                    "none";


                if (!review) {

                    errorElement.textContent =
                        "Please enter a review.";

                    return;
                }


                try {

                    const response =
                        await fetch(
                            "/predict",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        {
                                            review: review
                                        }
                                    )
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.detail
                            || "Prediction failed."
                        );
                    }


                    document
                        .getElementById(
                            "sentiment"
                        )
                        .textContent =
                            data.sentiment;


                    document
                        .getElementById(
                            "confidence"
                        )
                        .textContent =
                            (
                                data.confidence
                                * 100
                            ).toFixed(1)
                            + "%";


                    document
                        .getElementById(
                            "confidence-level"
                        )
                        .textContent =
                            data.confidence_level;


                    document
                        .getElementById(
                            "negative"
                        )
                        .textContent =
                            (
                                data
                                    .probabilities
                                    .negative
                                * 100
                            ).toFixed(1)
                            + "%";


                    document
                        .getElementById(
                            "neutral"
                        )
                        .textContent =
                            (
                                data
                                    .probabilities
                                    .neutral
                                * 100
                            ).toFixed(1)
                            + "%";


                    document
                        .getElementById(
                            "positive"
                        )
                        .textContent =
                            (
                                data
                                    .probabilities
                                    .positive
                                * 100
                            ).toFixed(1)
                            + "%";


                    document
                        .getElementById(
                            "uncertain"
                        )
                        .textContent =
                            data.is_uncertain
                                ? "Yes"
                                : "No";


                    resultElement.style.display =
                        "block";

                }

                catch (error) {

                    errorElement.textContent =
                        error.message;

                }

            }
        );


        /*
        ==============================
        BATCH ANALYSIS
        ==============================
        */


        const batchButton =
            document.getElementById(
                "batch-button"
            );


        batchButton.addEventListener(
            "click",

            async function () {

                const batchText =
                    document
                        .getElementById(
                            "batch-reviews"
                        )
                        .value
                        .trim();


                const batchError =
                    document.getElementById(
                        "batch-error"
                    );


                const batchResults =
                    document.getElementById(
                        "batch-results"
                    );


                const tableBody =
                    document.getElementById(
                        "batch-table-body"
                    );


                batchError.textContent = "";

                batchResults.style.display =
                    "none";

                tableBody.innerHTML = "";


                if (!batchText) {

                    batchError.textContent =
                        "Please enter at least one review.";

                    return;
                }


                /*
                Convert:

                review 1
                review 2
                review 3

                into:

                [
                    "review 1",
                    "review 2",
                    "review 3"
                ]
                */

                const reviews =
                    batchText
                        .split("\n")
                        .map(
                            review =>
                                review.trim()
                        )
                        .filter(
                            review =>
                                review.length > 0
                        );


                try {

                    const response =
                        await fetch(
                            "/predict-batch",

                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        {
                                            reviews: reviews
                                        }
                                    )
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.detail
                            || "Batch prediction failed."
                        );
                    }


                    for (
                        const prediction
                        of data.predictions
                    ) {

                        const row =
                            document.createElement(
                                "tr"
                            );


                        const reviewCell =
                            document.createElement(
                                "td"
                            );

                        reviewCell.textContent =
                            prediction.review;


                        const sentimentCell =
                            document.createElement(
                                "td"
                            );

                        sentimentCell.textContent =
                            prediction.sentiment;


                        const confidenceCell =
                            document.createElement(
                                "td"
                            );

                        confidenceCell.textContent =
                            (
                                prediction.confidence
                                * 100
                            ).toFixed(1)
                            + "%";


                        const uncertainCell =
                            document.createElement(
                                "td"
                            );

                        uncertainCell.textContent =
                            prediction.is_uncertain
                                ? "Yes"
                                : "No";


                        row.appendChild(
                            reviewCell
                        );

                        row.appendChild(
                            sentimentCell
                        );

                        row.appendChild(
                            confidenceCell
                        );

                        row.appendChild(
                            uncertainCell
                        );


                        tableBody.appendChild(
                            row
                        );
                    }


                    batchResults.style.display =
                        "block";

                }

                catch (error) {

                    batchError.textContent =
                        error.message;

                }

            }
        );

    </script>

</body>

</html>
